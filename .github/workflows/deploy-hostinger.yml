name: Deploy to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "hostinger-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTPS to yasine.org
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: ./
          # Never enable dangerous-clean-slate: the live server also holds
          # files this repo doesn't track (e.g. tools/tools/Travels-store.*),
          # and a clean-slate sync would delete them.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.nojekyll
