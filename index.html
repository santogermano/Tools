<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A weekly-refreshed events guide for Eindhoven, Tilburg and around — concerts, theatre, comedy, markets, exhibitions and talks, with prices, times and advance-booking heads-up.">
<meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<title>Agenda — Eindhoven/Tilburg</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#f4f4f4; --layer:#ffffff; --layer-hover:#e8e8e8; --text:#161616; --text-2:#525252; --text-3:#6f6f6f;
  --border:#e0e0e0; --border-strong:#c6c6c6;
  --green:#198038; --green-hover:#0e6027; --green-contrast:#ffffff;
  --cat-music:#4a3aa7; --cat-nightlife:#a8175f; --cat-theatre:#c72e2e; --cat-comedy:#b5750a;
  --cat-film:#0043ce; --cat-art:#0e6027; --cat-market:#c1440e; --cat-family:#146314; --cat-talks:#525252;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-agenda-theme="light"]){
    --bg:#161616; --layer:#262626; --layer-hover:#333333; --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#a8a8a8;
    --border:#393939; --border-strong:#525252;
    --green:#42be65; --green-hover:#6fdc8c; --green-contrast:#161616;
    --cat-music:#9085e9; --cat-nightlife:#e37fb0; --cat-theatre:#ff8389; --cat-comedy:#e8a13d;
    --cat-film:#5c9dff; --cat-art:#42be65; --cat-market:#ff8c5a; --cat-family:#6fdc8c; --cat-talks:#a8a8a8;
    color-scheme: dark;
  }
}
:root[data-agenda-theme="dark"]{
  --bg:#161616; --layer:#262626; --layer-hover:#333333; --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#a8a8a8;
  --border:#393939; --border-strong:#525252;
  --green:#42be65; --green-hover:#6fdc8c; --green-contrast:#161616;
  --cat-music:#9085e9; --cat-nightlife:#e37fb0; --cat-theatre:#ff8389; --cat-comedy:#e8a13d;
  --cat-film:#5c9dff; --cat-art:#42be65; --cat-market:#ff8c5a; --cat-family:#6fdc8c; --cat-talks:#a8a8a8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{ margin:0; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; line-height:1.5; font-size:14px; transition:background .25s, color .25s; }
.mono{font-family:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric:tabular-nums}
a{color:var(--text)}
a:hover{color:var(--green)}
h1,h2,h3{text-wrap:balance; margin:0}
::selection{background:var(--green); color:var(--green-contrast)}
:focus-visible{outline:2px solid var(--green); outline-offset:2px; border-radius:0}
button{font:inherit}

.wrap{max-width:760px; margin:0 auto; padding:0 20px 50px}

.theme-btn{
  position:fixed; top:14px; right:14px; width:30px; height:30px; border:0; background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-3);
  opacity:.5; border-radius:999px; transition:opacity .2s, background .2s; z-index:20;
}
.theme-btn:hover{opacity:1; background:var(--layer-hover)}
.theme-btn svg{width:15px; height:15px}
.theme-btn .i-moon{display:none}
:root[data-agenda-theme="dark"] .theme-btn .i-sun{display:none}
:root[data-agenda-theme="dark"] .theme-btn .i-moon{display:block}

header.masthead{ padding:40px 0 22px; display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.brand{display:flex; align-items:center; gap:12px}
.badge{ background:var(--text); color:var(--bg); font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:.95rem; padding:8px 10px; line-height:1; letter-spacing:.01em; border-radius:8px; }
.brand-text h1{ font-size:1.2rem; font-weight:600; letter-spacing:-0.01em; }
.brand-text p{ margin:2px 0 0; font-size:.84rem; color:var(--text-2); max-width:34ch; }
.meta-stats{ display:flex; gap:16px; font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; text-align:right; }
.meta-stats div strong{display:block; font-size:1.05rem; color:var(--text); font-weight:600; letter-spacing:0; text-transform:none}

/* Hero: a horizontally-scrolling strip built live from the viewer's own favourites
   (falls back to a prominence ranking — see heroScore() — when nothing's favourited
   yet; events that are already over are never featured).
   Re-rendered in full on every favourite toggle, so it never goes stale. */
.hero{margin:2px 0 26px}
.hero[hidden]{display:none}
.hero-label{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px}
.hero-label h2{font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3)}
.hero-sub{font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3); white-space:nowrap}
.hero-track{display:flex; gap:14px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch}
.hero-track::-webkit-scrollbar{height:6px}
.hero-track::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:999px}
.hero-card{
  position:relative; flex:none; width:320px; height:210px; border-radius:16px; overflow:hidden;
  scroll-snap-align:start; text-decoration:none; display:block; background:var(--layer);
  border:1px solid var(--border); transition:transform .2s, border-color .2s, box-shadow .2s;
}
.hero-card:hover{transform:translateY(-2px); border-color:var(--border-strong); box-shadow:0 10px 24px -10px rgba(0,0,0,.28)}
.hero-card .img-wrap{position:absolute; inset:0; overflow:hidden; background:var(--layer-hover)}
.hero-card .img-wrap img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .45s ease}
.hero-card:hover .img-wrap img{transform:scale(1.08)}
.hero-card .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 34%, rgba(0,0,0,.74) 100%); pointer-events:none}
.hero-card .hero-tag{ position:absolute; top:11px; left:11px; font-family:"IBM Plex Sans", sans-serif; font-size:.68rem; font-weight:600; padding:3px 9px; border-radius:999px; color:#fff; background:color-mix(in srgb, var(--c, var(--text-3)) 75%, black 25%); z-index:2; }
.hero-fav{
  position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:999px; z-index:2;
  background:rgba(22,22,22,.4); backdrop-filter:blur(6px); border:0; cursor:pointer; color:#fff; font-size:1.05rem;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.hero-fav:hover{background:rgba(22,22,22,.6)}
.hero-fav[aria-pressed="true"]{color:#ffd43b}
.hero-body{position:absolute; left:0; right:0; bottom:0; padding:13px; z-index:1; color:#fff}
.hero-card h3{font-size:1rem; font-weight:600; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.45)}
.hero-meta{margin-top:4px; font-size:.72rem; opacity:.92; font-family:"IBM Plex Mono", monospace; text-shadow:0 1px 3px rgba(0,0,0,.5)}
@media (max-width:560px){ .hero-card{width:250px; height:170px} }

.controls{ position:sticky; top:0; z-index:5; padding:12px 0 14px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); }
.search{ display:flex; align-items:center; gap:9px; background:var(--layer); border:1px solid var(--border); padding:9px 12px; margin-bottom:0; border-radius:10px; transition:border-color .2s; }
.search:focus-within{border-color:var(--green)}
.search svg{flex:none; opacity:.5}
.search input{ border:0; background:none; outline:none; width:100%; font-family:"IBM Plex Sans", sans-serif; font-size:.88rem; color:var(--text); }
.search input::placeholder{color:var(--text-3)}

/* Sidebar: a This-Is-Eindhoven-style faceted filter panel — grouped sections with
   radio (single-select: When) or checkbox (multi-select: type/city/price/view) rows,
   instead of wrapped chip pills. Collapsible behind a "Show filters" button on mobile,
   always-open and sticky on desktop (see the min-width:900px block below). */
.filters-toggle-mobile{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-bottom:14px;
  font-family:"IBM Plex Sans", sans-serif; font-weight:600; font-size:.85rem; color:var(--text);
  background:var(--layer); border:1px solid var(--border); border-radius:10px; padding:11px; cursor:pointer;
}
.filters-toggle-mobile svg{width:15px; height:15px; flex:none}
.filters-toggle-mobile .ftm-count{
  font-family:"IBM Plex Mono", monospace; font-size:.68rem; font-weight:600; background:var(--green);
  color:var(--green-contrast); padding:1px 7px; border-radius:999px;
}
.sidebar{
  background:var(--layer); border:1px solid var(--border); border-radius:14px; padding:18px;
  margin-bottom:18px; display:none; flex-direction:column; gap:20px;
}
.sidebar.open{display:flex}
.sb-section h3{
  font-family:"IBM Plex Mono", monospace; font-size:.68rem; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-3); margin:0 0 8px;
}
.sb-list{display:flex; flex-direction:column; gap:1px}
.sb-row{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:0;
  padding:6px; margin:0 -6px; border-radius:7px; cursor:pointer; font-family:"IBM Plex Sans", sans-serif;
  font-size:.85rem; color:var(--text); transition:background .15s;
}
.sb-row:hover{background:var(--layer-hover)}
.sb-row .ind{
  width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border-strong); flex:none;
  display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
}
.sb-row.sq .ind{border-radius:4px}
.sb-row[aria-pressed="true"] .ind{background:var(--c, var(--green)); border-color:var(--c, var(--green))}
.sb-row[aria-pressed="true"] .ind::after{content:''; width:6px; height:6px; border-radius:50%; background:#fff}
.sb-row.sq[aria-pressed="true"] .ind::after{
  width:8px; height:5px; border-radius:0; background:none;
  border-bottom:2px solid #fff; border-left:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px);
}
.sb-row .cat-dot{width:7px; height:7px; border-radius:50%; background:var(--c, var(--text-3)); flex:none}
.sb-row .label{flex:1; min-width:0}
.sb-row .n{font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3); flex:none}
.sb-clear{
  align-self:flex-start; font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--text-3);
  background:none; border:1px solid var(--border); padding:6px 12px; border-radius:999px; cursor:pointer;
  transition:color .15s, border-color .15s;
}
.sb-clear:hover{color:var(--text); border-color:var(--border-strong)}

/* On mobile the open filter panel is taller than the viewport, so a tap on a filter
   near the top updates the (correct) result count and list far below the fold —
   easy to mistake for "nothing happened". This sticky bar pins a live result count to
   the bottom of the screen while the panel is open, and tapping it closes the panel
   and scrolls straight to the (already-filtered) results, so the effect of every tap
   is immediately visible without hunting for it. Desktop's sidebar is a normal
   always-visible column, not an overlay, so it's hidden there (see min-width:900px). */
.sb-show-results{
  position:sticky; bottom:0; left:0; right:0; margin:4px -18px -18px; padding:14px;
  font-family:"IBM Plex Sans", sans-serif; font-weight:600; font-size:.88rem;
  color:var(--green-contrast); background:var(--green); border:0; cursor:pointer;
  border-radius:0 0 13px 13px; box-shadow:0 -6px 16px -4px rgba(0,0,0,.25);
}
.sb-show-results:hover{background:var(--green-hover)}

.result-count{ margin-top:10px; font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--text-3); }
.result-count button{ color:var(--text); background:none; border:0; cursor:pointer; text-decoration:underline; padding:0; margin-left:6px; font:inherit; }

main{padding:6px 0 40px}
.collapse-all-btn{ display:block; margin:0 0 12px auto; font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--text-3); background:none; border:1px solid var(--border); padding:5px 11px; border-radius:999px; cursor:pointer; transition:color .15s, border-color .15s; }
.collapse-all-btn:hover{color:var(--text); border-color:var(--border-strong)}
.day-header{ display:flex; align-items:baseline; gap:10px; padding:20px 2px 9px; cursor:pointer; user-select:none; width:100%; background:none; border:0; text-align:left; color:inherit; }
.day-header .chevron{ flex:none; width:15px; height:15px; color:var(--text-3); transition:transform .2s; }
.day-header:hover .chevron{color:var(--text)}
.day-header .dow{ font-family:"IBM Plex Sans", sans-serif; font-weight:600; font-size:1rem; }
.day-header .dow.today{color:var(--green)}
.day-header .ddate{font-family:"IBM Plex Mono", monospace; font-size:.76rem; color:var(--text-3)}
.day-header .day-count{ font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3); display:none; }
.day-header .rule{flex:1; height:1px; background:var(--border)}
.day-block.collapsed .chevron{transform:rotate(-90deg)}
.day-block.collapsed .events{display:none}
.day-block.collapsed .day-header .day-count{display:inline}
.day-header .dow.tomorrow{color:var(--text)}

/* Past days (before today, per the viewer's Amsterdam-local date) are folded into one
   collapsed "Past days" row at the top of the list, so the list opens on today instead
   of on Monday's already-finished events. Events still running today (festivals,
   exhibitions) are regrouped under today and never hidden in here. */
.past-group.collapsed .past-days{display:none}
.past-group.collapsed > .day-header .chevron{transform:rotate(-90deg)}
.past-group > .day-header .day-count{display:inline}
.past-group > .day-header .dow, .past-days .day-header .dow{color:var(--text-3)}
.past-group.hidden{display:none}
.past-days .event{opacity:.72}
.past-days .event:hover{opacity:1}
.past-group > .day-header .dow, .past-group > .day-header .day-count{white-space:nowrap}
@media (max-width:560px){ .past-group > .day-header .ddate{display:none} }

.events{display:flex; flex-direction:column; gap:14px}
.event{
  display:flex; flex-direction:column; overflow:hidden; text-decoration:none;
  border:1px solid var(--border); background:var(--layer); border-radius:14px;
  transition:background .2s, border-color .2s, transform .2s, box-shadow .2s;
}
.event:hover{ border-color:var(--border-strong); transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(0,0,0,.28); }
.event .media{ position:relative; width:100%; aspect-ratio:16/10; background:var(--layer-hover); overflow:hidden; flex:none; }
.event .media img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s; }
.event:hover .media img{transform:scale(1.05)}
.event .media.media-fallback{ display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, color-mix(in srgb, var(--c, var(--text-3)) 32%, var(--layer)), color-mix(in srgb, var(--c, var(--text-3)) 10%, var(--layer))); color:color-mix(in srgb, var(--c, var(--text-3)) 70%, var(--text)); }
.event .media.media-fallback svg{width:36px; height:36px; opacity:.75}
.event .media .badge-range{ position:absolute; top:9px; left:9px; font-family:"IBM Plex Mono", monospace; font-size:.66rem; font-weight:600; color:#fff; background:rgba(0,0,0,.55); backdrop-filter:blur(2px); padding:3px 8px; border-radius:999px; }
.event .media .badge-cat{ position:absolute; top:9px; right:9px; font-family:"IBM Plex Sans", sans-serif; font-size:.66rem; font-weight:600; color:#fff; background:color-mix(in srgb, var(--c, var(--text-3)) 75%, black 25%); padding:3px 9px; border-radius:999px; }
.event .body{ padding:13px 14px 12px; display:flex; flex-direction:column; flex:1; }
.title-row{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
.event h3{ font-size:1rem; font-weight:600; color:var(--c, var(--text)); line-height:1.3; }
.event .venueline{ margin-top:3px; font-size:.82rem; color:var(--text-2); display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
.event .venueline .code{ font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3); background:color-mix(in srgb, var(--text) 6%, var(--layer)); padding:1px 5px; border-radius:5px; }
.event .meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:9px; }
.event .meta-pill{ display:inline-flex; align-items:center; gap:4px; font-family:"IBM Plex Mono", monospace; font-size:.72rem; font-weight:600; color:var(--text-2); background:color-mix(in srgb, var(--text) 6%, var(--layer)); padding:4px 8px; border-radius:999px; line-height:1.1; }
.event .meta-pill svg{width:11px; height:11px; flex:none; opacity:.85}
.event .meta-pill.price-free{ color:var(--green); background:color-mix(in srgb, var(--green) 16%, var(--layer)); }
.event .meta-pill.price-unknown, .event .meta-pill.time-unknown{ color:var(--text-3); font-weight:500; }
.event .desc{ margin-top:8px; font-size:.83rem; color:var(--text-2); max-width:56ch; }
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px}
.tag{ font-family:"IBM Plex Sans", sans-serif; font-weight:500; font-size:.68rem; padding:3px 8px; border-radius:999px; background:color-mix(in srgb, var(--c, var(--text-3)) 15%, var(--layer)); color:color-mix(in srgb, var(--c, var(--text-3)) 80%, var(--text)); }

.actions{display:flex; align-items:center; justify-content:space-between; gap:2px; margin-top:auto; padding-top:10px; border-top:1px solid var(--border);}
.actions .left{display:flex; align-items:center; gap:2px}
.icon-btn{ width:28px; height:28px; border:0; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-3); padding:0; border-radius:8px; transition:background .15s, color .15s; }
.icon-btn:hover{background:var(--layer-hover); color:var(--text)}
.icon-btn svg{width:15px; height:15px}
.icon-btn.fav{font-size:1rem; line-height:1}
.icon-btn.fav[aria-pressed="true"]{color:var(--green)}
.go{ color:var(--text-3); display:flex; align-items:center; gap:4px; font-family:"IBM Plex Mono", monospace; font-size:.72rem; font-weight:600; transition:color .15s, transform .15s; }
.go svg{width:13px; height:13px; flex:none}
.event:hover .go{color:var(--c, var(--green)); transform:translateX(1px)}

.event.is-fav{ border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
.event .heads-up{
  display:flex; align-items:center; gap:7px; font-size:.76rem; line-height:1.35; padding:8px 14px;
  background:color-mix(in srgb, var(--c) 14%, var(--layer)); color:color-mix(in srgb, var(--c) 85%, var(--text));
  border-bottom:1px solid color-mix(in srgb, var(--c) 25%, var(--border));
}
.event .heads-up .hu-icon{flex:none; font-size:.9em}
.event .heads-up strong{font-weight:700}

.event.hidden{display:none}
.day-block.hidden{display:none}

.empty-state{padding:60px 0; text-align:center; color:var(--text-2); display:none}
.empty-state.show{display:block}

.layout{display:block}
.content{min-width:0}

footer{
  border-top:1px solid var(--border); margin-top:20px; padding:20px 0 10px;
  font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--text-3);
  display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between;
}

@media (min-width:900px){
  .wrap{max-width:1120px}
  .filters-toggle-mobile{display:none}
  .layout{display:grid; grid-template-columns:240px minmax(0,1fr); gap:26px; align-items:start}
  .sidebar{display:flex !important; position:sticky; top:14px; max-height:calc(100vh - 28px); overflow-y:auto; margin-bottom:0}
  .sb-show-results{display:none}
  .events{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px; align-items:start}
}
@media (max-width:560px){
  .wrap{padding:0 14px 40px}
  header.masthead{padding:28px 0 16px}
  .meta-stats{display:none}
  .event .media{aspect-ratio:16/9}
  .go .go-label{display:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
  <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
  <svg class="i-moon" viewBox="0 0 24 24"><defs><mask id="moonMask"><rect width="24" height="24" fill="white"></rect><circle cx="15" cy="9" r="7" fill="black"></circle></mask></defs><circle cx="12" cy="12" r="8" fill="currentColor" mask="url(#moonMask)"></circle></svg>
</button>

<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <div class="badge">EINDHOVEN</div>
      <div class="brand-text">
        <h1>Agenda</h1>
        <p>Eindhoven, Tilburg &amp; around — refreshed weekly</p>
      </div>
    </div>
    <div class="meta-stats" id="metaStats"></div>
  </header>

// CITY_ORDER/AREA_CODES were previously hardcoded literals here, frozen to whichever
// cities existed the week this template was written. Each weekly rebuild updates
// META.cityOrder/META.areaCodes with the real city list, but the frontend was still
// reading the stale hardcoded copies — so any city added after the template's last
// hand-edit (e.g. Den Bosch) silently had NO checkbox in the City filter at all, and
// could never be isolated or excluded. Deriving these from META (with a same-shape
// fallback in case older cached data is missing the field) keeps the filter panel and
// the data in permanent sync with zero template edits required.
const CITY_ORDER = (META.cityOrder && META.cityOrder.length) ? META.cityOrder : [...new Set(EVENTS.map(e => e.city))];
const AREA_CODES = Object.assign({"Eindhoven":"040","Tilburg":"013","Breda":"076","Den Bosch":"073","Veldhoven":"040"}, META.areaCodes || {});

const TYPE_COLOR_VAR = {
  "Music": "var(--cat-music)", "Nightlife": "var(--cat-nightlife)", "Theatre & Dance": "var(--cat-theatre)",
  "Comedy": "var(--cat-comedy)", "Film": "var(--cat-film)", "Art & Exhibitions": "var(--cat-art)",
  "Markets & Food": "var(--cat-market)", "Family & Outdoor": "var(--cat-family)", "Talks & Workshops": "var(--cat-talks)"
};
// Advance-booking / special-attention flags an event can carry (heads_up + a short
// human-readable heads_up_reason, verified per-event during research — see digest-sources
// notes). Kept separate from the category color system: severity here is about urgency
// of ACTION (book now / register / expect it to be full), not what kind of event it is.
const HEADS_UP_STYLE = {
  sold_out: { icon: '⛔', label: 'Sold out', colorVar: 'var(--cat-theatre)' },
  popular: { icon: '🔥', label: 'High demand', colorVar: 'var(--cat-comedy)' },

};

document.addEventListener('DOMContentLoaded', function () {
  const state = { types: new Set(), cities: new Set(), q: "", favOnly: false, planOnly: false, when: 'all', free: false };
  const $ = sel => document.getElementById(sel);

  const themeBtn = $('themeBtn');
  const savedTheme = (() => { try { return localStorage.getItem('agenda-theme'); } catch(e){ return null; } })();
  const initialTheme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const setTheme = t => {
    document.documentElement.setAttribute('data-agenda-theme', t);
    document.body.setAttribute('data-agenda-theme', t);
  };
  setTheme(initialTheme);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-agenda-theme') === 'dark' ? 'light' : 'dark';
    setTheme(next);
    try { localStorage.setItem('agenda-theme', next); } catch(e){}
  });

  const favKey = e => e.title + '|' + e.dateStart;
  let favorites = new Set((() => { try { return JSON.parse(localStorage.getItem('agenda-favorites') || '[]'); } catch(e){ return []; } })());
  const toggleFav = key => {
    if (favorites.has(key)) favorites.delete(key); else favorites.add(key);
    try { localStorage.setItem('agenda-favorites', JSON.stringify([...favorites])); } catch(e){}
  };
  // Keyed lookup of each event's favourite button in the day list, so toggling a
  // favourite from the hero strip (or vice versa) keeps both in sync without a
  // full page re-render. Populated as each row is built below.
  const favButtons = {};
  const onToggleFav = key => {
    toggleFav(key);
    const on = favorites.has(key);
    const listBtn = favButtons[key];
    if (listBtn) {
      listBtn.setAttribute('aria-pressed', String(on));
      listBtn.textContent = on ? '★' : '☆';
      listBtn.closest('.event').classList.toggle('is-fav', on);
    }
    updateFavBtnLabel();
    if (state.favOnly) render();
    renderHero();
  };

  const pad = n => String(n).padStart(2,'0');

  // ---- Dates -------------------------------------------------------------------
  // All day keys are plain "YYYY-MM-DD" strings. They used to be derived with
  // toISOString(), which converts to UTC: in the Netherlands (UTC+1/+2) local midnight
  // is still the PREVIOUS day in UTC, so addDays(today, 1) returned today — "Tomorrow"
  // showed today's events, "This weekend" showed Fri–Sat, "Next 7 days" was 6 days, and
  // between 00:00–02:00 "today" itself was yesterday. Everything below stays in local
  // calendar terms, and "today" is taken in Europe/Amsterdam (where every event is),
  // falling back to the device's local date if Intl time zones are unavailable.
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayStr = (() => {
    try {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      const get = t => parts.find(p => p.type === t).value;
      return `${get('year')}-${get('month')}-${get('day')}`;
    } catch (err) { return ymd(new Date()); }
  })();
  const addDays = (dateStr, n) => { const d = new Date(dateStr + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
  // Grouping keys — see the "Past days" notes further down for why ongoing events move to today.
  const startDay = e => (e.dateStart < META.windowStart ? META.windowStart : e.dateStart);
  // Older weekly runs stored long-running exhibitions (opened before the window, closing
  // next year) as dateStart = windowStart with dateEnd = null. Read literally that is a
  // one-day event on the window's first day — it would fold into "Past days" by Tuesday
  // and drop out of "Today". Untimed, exhibition-first, clamped-start, no-end events are
  // therefore treated as running through the whole window. (Newer runs keep the real
  // closing date instead; the "t/m" badge already hides other-year end dates.)
  const isOpenEndedRun = e => !e.dateEnd && e.dateStart <= META.windowStart &&
    (e.tags || [])[0] === 'Art & Exhibitions' && !/\d{1,2}:\d{2}/.test(e.time || '');
  const endDay = e => {
    const s = startDay(e);
    if (e.dateEnd && e.dateEnd >= s) return e.dateEnd;
    if (isOpenEndedRun(e) && META.windowEnd > s) return META.windowEnd;
    return s;
  };
  const groupDay = e => { const s = startDay(e); return (s < todayStr && endDay(e) >= todayStr) ? todayStr : s; };

  // ---- Add to calendar (.ics) ---------------------------------------------------
  // Research writes times in free form ("20:30", "20:00-02:00", "20:15 (doors 19:30)",
  // "13:00-16:30 / 18:30-22:00", "11:15 & 13:00", or none). Only the first HH:MM (and
  // an HH:MM directly after a dash) is used; anything unparseable becomes an all-day
  // entry instead of the old "TNaNNaN00" timestamps. An end time at/before the start
  // means the event runs past midnight, so its end rolls over to the next day.
  const parseTimes = t => {
    const m = (t || '').match(/(\d{1,2}):(\d{2})(?:\s*[-–]\s*(\d{1,2}):(\d{2}))?/);
    if (!m) return null;
    return { start: (+m[1]) * 60 + (+m[2]), end: m[3] != null ? (+m[3]) * 60 + (+m[4]) : null };
  };
  const icsStamp = (dateStr, mins) => dateStr.replace(/-/g, '') + 'T' + pad(Math.floor(mins / 60)) + pad(mins % 60) + '00';
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
  const icsFold = line => { // RFC 5545: lines longer than 75 octets must be folded
    const out = []; let cur = '', bytes = 0;
    for (const ch of line) {
      const b = new TextEncoder().encode(ch).length;
      if (bytes + b > 73) { out.push(cur); cur = ' '; bytes = 1; }
      cur += ch; bytes += b;
    }
    out.push(cur); return out.join('\r\n');
  };
  const buildICS = (e, day) => {
    const date = day || e.dateStart;
    const t = parseTimes(e.time);
    let dtStart, dtEnd;
    if (t) {
      const endMins = t.end != null ? t.end : t.start + 60;
      const endDate = (endMins <= t.start || endMins >= 1440) ? addDays(date, 1) : date;
      dtStart = 'DTSTART:' + icsStamp(date, t.start);
      dtEnd = 'DTEND:' + icsStamp(endDate, endMins % 1440);
    } else {
      // All-day. Short multi-day runs (a weekend festival) span their real days; long
      // exhibition runs become a single all-day reminder on the chosen day rather than a
      // two-month block across the calendar.
      const last = (e.dateEnd && e.dateEnd > date && e.dateEnd <= addDays(date, 6)) ? e.dateEnd : date;
      dtStart = 'DTSTART;VALUE=DATE:' + date.replace(/-/g, '');
      dtEnd = 'DTEND;VALUE=DATE:' + addDays(last, 1).replace(/-/g, '');
    }
    let h = 0; for (const ch of favKey(e)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const now = new Date();
    const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
    const desc = (e.description || '') + (e.time ? '\nTime: ' + e.time : '') + (e.price && e.price !== 'free' ? '\nPrice: ' + e.price : '') + (e.url ? '\n' + e.url : '');
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//events.yasine.org//Agenda//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
      'UID:' + h.toString(36) + '-' + date.replace(/-/g, '') + '@events.yasine.org',
      'DTSTAMP:' + stamp,
      'SUMMARY:' + icsEsc(e.title),
      dtStart, dtEnd,
      'LOCATION:' + icsEsc(e.venue + ', ' + e.city),
      'DESCRIPTION:' + icsEsc(desc),
      'URL:' + (e.url || ''),
      'END:VEVENT', 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
  };
  const downloadICS = (e, day) => {
    const blob = new Blob([buildICS(e, day)], {type:'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (e.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60) || 'event') + '.ics';
    document.body.appendChild(a); a.click(); a.remove();
    // Revoking synchronously can cancel the download in Safari/Firefox.
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  const fmtRange = (d1, d2) => {
    const opts = {day:'numeric', month:'short'};
    const a = new Date(d1+"T00:00:00");
    const start = a.toLocaleDateString('en-GB', opts).replace('.', '');
    if(!d2 || d2 === d1) return start;
    const b = new Date(d2+"T00:00:00");
    return start + "–" + b.toLocaleDateString('en-GB', opts).replace('.', '');
  };
  const weekday = d => new Date(d+"T00:00:00").toLocaleDateString('en-GB', {weekday:'long'});
  const weekdayAbbr = d => new Date(d+"T00:00:00").toLocaleDateString('en-GB', {weekday:'short'});
  const tomorrowStr = addDays(todayStr, 1);
  const next7Str = addDays(todayStr, 6);
  const todayDow = new Date(todayStr+"T00:00:00").getDay(); // 0=Sun..6=Sat
  let weekendStart, weekendEnd;
  if (todayDow === 6) { weekendStart = todayStr; weekendEnd = tomorrowStr; }
  else if (todayDow === 0) { weekendStart = todayStr; weekendEnd = todayStr; }
  else { const off = 6 - todayDow; weekendStart = addDays(todayStr, off); weekendEnd = addDays(todayStr, off + 1); }
  function whenMatches(dayStart, dayEnd) {
    if (state.when === 'all') return true;
    const overlaps = (a, b) => dayStart <= b && dayEnd >= a;
    if (state.when === 'today') return overlaps(todayStr, todayStr);
    if (state.when === 'tomorrow') return overlaps(tomorrowStr, tomorrowStr);
    if (state.when === 'weekend') return overlaps(weekendStart, weekendEnd);
    if (state.when === 'week') return overlaps(todayStr, next7Str);
    return true;
  }
  const freeCount = EVENTS.filter(e => e.price === 'free').length;

  // Hero: favourited events with a photo, falling back — when nothing's favourited yet —
  // to a prominence ranking rather than plain chronology. heads_up already flags events
  // that are in demand or need advance planning (sold_out > popular > limited >
  // registration); multi-day runs/festivals and titles containing "festival" are treated
  // as major happenings too. Soonest date only breaks ties within the same score, so a
  // must-see later this week still outranks a minor talk tomorrow. Re-rendered in full on
  // every favourite toggle (see onToggleFav above) so it's always in sync.
  // True for a single-day event today whose (end, or start + 2h) time has passed.
  const nowMins = (() => {
    try {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
      return (+parts.find(p => p.type === 'hour').value) * 60 + (+parts.find(p => p.type === 'minute').value);
    } catch (err) { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  })();
  const overToday = e => {
    if (endDay(e) !== todayStr || startDay(e) !== todayStr) return false;
    const t = parseTimes(e.time); if (!t) return false;
    const end = t.end != null ? (t.end <= t.start ? t.end + 1440 : t.end) : t.start + 120;
    return end <= nowMins;
  };
  function heroScore(e) {
    let s = 0;
    if (e.heads_up === 'sold_out') s += 4;
    else if (e.heads_up === 'popular') s += 3;
    else if (e.heads_up === 'limited') s += 2;
    else if (e.heads_up === 'registration') s += 1;
    if (e.dateEnd && e.dateEnd !== e.dateStart) s += 2; // multi-day run / festival
    if (/festival|\bfest\b/i.test(e.title)) s += 2;
    return s;
  }
  function renderHero() {
    const heroEl = $('hero');
    // Only events you can still attend: a sold-out show from Monday is "prominent" but
    // useless to highlight on Wednesday.
    const withPhoto = EVENTS.filter(e => e.photo && endDay(e) >= todayStr && !overToday(e));
    let picks = withPhoto.filter(e => favorites.has(favKey(e)));
    const isFav = picks.length > 0;
    if (!isFav) {
      picks = [...withPhoto].sort((a, b) => {
        const diff = heroScore(b) - heroScore(a);
        if (diff !== 0) return diff;
        const ka = groupDay(a) + 'T' + (a.time ? a.time.split('-')[0].trim() : '99:99');
        const kb = groupDay(b) + 'T' + (b.time ? b.time.split('-')[0].trim() : '99:99');
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });
    }
    picks = picks.slice(0, 8);
    if (!picks.length) { heroEl.hidden = true; heroEl.innerHTML = ''; return; }
    heroEl.hidden = false;
    heroEl.innerHTML = `
      <div class="hero-label">
        <h2>${isFav ? '★ Your favourites' : 'Highlighted this week'}</h2>
        <span class="hero-sub">${isFav ? picks.length + ' saved' : 'in-demand & major events this week'}</span>
      </div>
      <div class="hero-track">${picks.map(heroCardHTML).join('')}</div>`;
    heroEl.querySelectorAll('.hero-card').forEach(card => {
      card.querySelector('.hero-fav').addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        onToggleFav(card.dataset.key);
      });
    });
  }
  // Multi-day runs read "until 11 Oct" once they've started (a start date in the past
  // looks like a finished event), otherwise their real start–end range.
  const heroDate = e => {
    const end = endDay(e);
    if (isOpenEndedRun(e)) return 'ongoing';
    if (end === startDay(e) || end.slice(0,4) !== META.windowStart.slice(0,4)) return fmtRange(e.dateStart, null);
    return startDay(e) <= todayStr ? 'until ' + fmtRange(end, null) : fmtRange(startDay(e), end);
  };
  function heroCardHTML(e) {
    const key = favKey(e);
    const on = favorites.has(key);
    const timePart = e.time ? e.time.split('-')[0].trim() + ' · ' : '';
    return `<a class="hero-card" href="${e.url}" target="_blank" rel="noopener" data-key="${key}">
      <div class="img-wrap"><img src="${e.photo}" alt="" loading="lazy"></div>
      <div class="scrim"></div>
      <span class="hero-tag" style="--c:${TYPE_COLOR_VAR[e.tags[0]]}">${e.tags[0]}</span>
      <button class="hero-fav" aria-pressed="${on}" aria-label="Favorite">${on ? '★' : '☆'}</button>
      <div class="hero-body"><h3>${e.title}</h3><div class="hero-meta">${heroDate(e)} · ${timePart}${e.venue}</div></div>
    </a>`;
  }

  $('metaStats').innerHTML =
    `<div>${fmtRange(META.windowStart, META.windowEnd)} · <strong style="color:var(--green)">${META.eventCount} events</strong></div>`;
  $('sourceCount').textContent = SOURCES.length ? `${SOURCES.length} sources checked` : '';

  // Sidebar filter panel — a This-Is-Eindhoven-style faceted layout: grouped sections,
  // each option a full-width row with a radio (single-select) or checkbox (multi-select)
  // indicator, rather than wrapped chip pills. sq = square/checkbox row; the default
  // (no .sq) renders a round/radio row.
  const sidebarEl = $('sidebar');
  const filtersToggleBtn = $('filtersToggleMobile');
  const closeMobileFilters = () => {
    if (!window.matchMedia('(max-width:899px)').matches) return;
    sidebarEl.classList.remove('open');
    filtersToggleBtn.setAttribute('aria-expanded', 'false');
    $('ftmLabel').textContent = 'Show filters';
  };
  filtersToggleBtn.addEventListener('click', () => {
    const open = sidebarEl.classList.toggle('open');
    filtersToggleBtn.setAttribute('aria-expanded', String(open));
    $('ftmLabel').textContent = open ? 'Hide filters' : 'Show filters';
  });
  // Mobile-only sticky bar (hidden on desktop, see the min-width:900px CSS block): the
  // filter panel itself is taller than the viewport, so a tap near the top of it updates
  // a result count that's scrolled off-screen below the panel — from the panel it looks
  // like nothing happened. This bar keeps a live count pinned to the bottom of the screen
  // and, on tap, closes the panel and scrolls straight to the newly-filtered results.
  const sbShowResultsBtn = $('sbShowResults');
  sbShowResultsBtn.addEventListener('click', () => {
    closeMobileFilters();
    scrollToResults();
  });

  // Scrolls a day block to just below the sticky search/controls bar (scrollIntoView
  // would park it underneath that bar). Target = the first visible upcoming day (today,
  // or the next day with events), falling back to the past-days row or the empty state.
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function scrollToEl(el) {
    if (!el) return;
    const controls = document.querySelector('.controls');
    const offset = (controls ? controls.offsetHeight : 0) + 6;
    const y = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top: Math.max(0, y), behavior: reducedMotion ? 'auto' : 'smooth' });
  }
  // fromDay: the first day of the chosen date range. Ongoing festivals/exhibitions are
  // grouped under Today, so with "Tomorrow" or "This weekend" selected the Today block
  // can still be visible (they run then too) — but the view should land on the day
  // that was asked for, not on Today.
  function scrollToResults(fromDay) {
    const visible = upcomingBlocks().filter(db => !db.el.classList.contains('hidden'));
    const firstUpcoming = (fromDay && visible.find(db => db.day >= fromDay)) || visible[0];
    if (firstUpcoming) return scrollToEl(firstUpcoming.el);
    if (pastGroupEl && !pastGroupEl.classList.contains('hidden')) return scrollToEl(pastGroupEl);
    scrollToEl($('emptyState').classList.contains('show') ? $('emptyState') : $('main'));
  }
  function updateFilterCount(){
    const n = state.types.size + state.cities.size + (state.when !== 'all' ? 1 : 0) +
      (state.free ? 1 : 0) + (state.favOnly ? 1 : 0) + (state.planOnly ? 1 : 0);
    const badge = $('ftmCount');
    badge.textContent = String(n);
    badge.hidden = n === 0;
  }

  const planCount = EVENTS.filter(e => e.heads_up).length;
  const viewFiltersEl = $('viewFilters');
  const favBtn = document.createElement('button');
  favBtn.className = 'sb-row sq';
  favBtn.setAttribute('aria-pressed', 'false');
  const updateFavBtnLabel = () => { favBtn.innerHTML = `<span class="ind"></span><span class="label">My favourites</span><span class="n">${favorites.size}</span>`; };
  updateFavBtnLabel();
  favBtn.addEventListener('click', () => {
    state.favOnly = !state.favOnly;
    favBtn.setAttribute('aria-pressed', String(state.favOnly));
    render();
  });
  viewFiltersEl.appendChild(favBtn);
  const planBtn = document.createElement('button');
  planBtn.className = 'sb-row sq';
  planBtn.style.setProperty('--c', 'var(--cat-comedy)');
  planBtn.setAttribute('aria-pressed', 'false');
  planBtn.innerHTML = `<span class="ind"></span><span class="label">Needs planning</span><span class="n">${planCount}</span>`;
  planBtn.addEventListener('click', () => {
    state.planOnly = !state.planOnly;
    planBtn.setAttribute('aria-pressed', String(state.planOnly));
    render();
  });
  if (planCount > 0) viewFiltersEl.appendChild(planBtn);

  const WHEN_OPTIONS = [
    {key:'all', label:'All dates'}, {key:'today', label:'Today'}, {key:'tomorrow', label:'Tomorrow'},
    {key:'weekend', label:'This weekend'}, {key:'week', label:'Next 7 days'}
  ];
  const whenFiltersEl = $('whenFilters');
  const whenBtns = [];
  // Per-option counts (dates only, ignoring other filters), same "n" column as the
  // other sidebar sections — so an empty "Tomorrow" is visible before you tap it.
  const whenCount = key => {
    const prev = state.when; state.when = key;
    const n = EVENTS.filter(e => { const d = groupDay(e); return whenMatches(d, endDay(e) >= d ? endDay(e) : d); }).length;
    state.when = prev; return n;
  };
  WHEN_OPTIONS.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'sb-row';
    b.dataset.when = opt.key;
    b.setAttribute('aria-pressed', opt.key === 'all' ? 'true' : 'false');
    b.innerHTML = `<span class="ind"></span><span class="label">${opt.label}</span><span class="n">${whenCount(opt.key)}</span>`;
    // A date choice is a navigation: filter, make sure the matching day(s) are expanded
    // (the viewer may have collapsed them by hand), close the mobile panel, and bring
    // the first matching day into view under the sticky search bar.
    b.addEventListener('click', () => {
      state.when = opt.key;
      whenBtns.forEach(c => c.setAttribute('aria-pressed', String(c === b)));
      render();
      upcomingBlocks().forEach(db => {
        const expand = opt.key === 'all' ? db.day === todayStr : !db.el.classList.contains('hidden');
        if (expand) {
          db.el.classList.remove('collapsed');
          db.el.querySelector('.day-header').setAttribute('aria-expanded', 'true');
        }
      });
      closeMobileFilters();
      scrollToResults({ tomorrow: tomorrowStr, weekend: weekendStart }[opt.key] || todayStr);
    });
    whenBtns.push(b);
    whenFiltersEl.appendChild(b);
  });

  const priceFiltersEl = $('priceFilters');
  let freeBtn = null;
  if (freeCount > 0) {
    freeBtn = document.createElement('button');
    freeBtn.className = 'sb-row sq';
    freeBtn.setAttribute('aria-pressed', 'false');
    freeBtn.innerHTML = `<span class="ind"></span><span class="label">Free events only</span><span class="n">${freeCount}</span>`;
    freeBtn.addEventListener('click', () => {
      state.free = !state.free;
      freeBtn.setAttribute('aria-pressed', String(state.free));
      render();
    });
    priceFiltersEl.appendChild(freeBtn);
  } else {
    $('sbPriceSection').hidden = true;
  }

  const cityCounts = {};
  EVENTS.forEach(e => cityCounts[e.city] = (cityCounts[e.city]||0)+1);
  const cityFiltersEl = $('cityFilters');
  CITY_ORDER.forEach(city => {
    if(!cityCounts[city]) return;
    const b = document.createElement('button');
    b.className = 'sb-row sq';
    b.setAttribute('aria-pressed','false');
    b.innerHTML = `<span class="ind"></span><span class="label">${city} <span class="mono" style="color:var(--text-3);font-size:.72rem">${AREA_CODES[city]||''}</span></span><span class="n">${cityCounts[city]}</span>`;
    b.addEventListener('click', () => toggle(state.cities, city, b));
    cityFiltersEl.appendChild(b);
  });

  const typeCounts = {};
  EVENTS.forEach(e => e.tags.forEach(t => typeCounts[t] = (typeCounts[t]||0)+1));
  const typeFiltersEl = $('typeFilters');
  TYPES.forEach(type => {
    const b = document.createElement('button');
    b.className = 'sb-row sq';
    b.style.setProperty('--c', TYPE_COLOR_VAR[type]);
    b.setAttribute('aria-pressed','false');
    b.innerHTML = `<span class="ind"></span><span class="cat-dot"></span><span class="label">${type}</span><span class="n">${typeCounts[type]||0}</span>`;
    b.addEventListener('click', () => toggle(state.types, type, b));
    typeFiltersEl.appendChild(b);
  });

  function toggle(set, val, btn){
    if(set.has(val)){ set.delete(val); btn.setAttribute('aria-pressed','false'); }
    else{ set.add(val); btn.setAttribute('aria-pressed','true'); }
    render();
  }
  $('searchInput').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
  // Two distinct empty-state messages share the one placeholder: the usual "no matches"
  // copy (with its Clear filters button) for ordinary filtering, and a friendlier nudge
  // when the Favorites view itself is simply empty (clearing type/city filters wouldn't
  // help there — the user just hasn't starred anything yet).
  $('emptyState').innerHTML = `<span id="emptyDefaultMsg">Nothing matches those filters.</span><span id="emptyFavMsg" hidden>No favorites saved yet — tap the ☆ on any event to add it here.</span> <button id="resetBtn" style="all:unset;cursor:pointer;color:var(--text);text-decoration:underline">Clear filters</button>`;
  const doReset = () => {
    state.types.clear(); state.cities.clear(); state.q = ""; state.when = 'all'; state.free = false;
    state.favOnly = false; state.planOnly = false;
    $('searchInput').value = "";
    document.querySelectorAll('.sb-row').forEach(c => c.setAttribute('aria-pressed','false'));
    whenBtns.forEach(c => c.setAttribute('aria-pressed', c.dataset.when === 'all' ? 'true' : 'false'));
    render();
  };
  $('resetBtn').addEventListener('click', doReset);
  $('resetBtnSidebar').addEventListener('click', doReset);

  // Generic "no photo" glyph used inside the fallback thumbnail tile — inline SVG,
  // no network fetch, colored via currentColor so it follows the category color and theme.
  const FALLBACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10.5" r="1.5"></circle><path d="m4 17 5-5 3.5 3.5L17 11l3 3"></path></svg>';
  const CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>';
  const TICKET_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"></path></svg>';
  const CHEVRON_ICON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

  // Long-running exhibitions can come back from research with their real opening date
  // (weeks or years before this window) rather than a date clamped to the digest's own
  // range. Grouped by raw dateStart, that scatters stray day-headers above "today" —
  // clamp the GROUPING key (not the underlying data) to windowStart so an event that's
  // merely still running always surfaces under the first visible day instead.
  //
  // An event that started before today but is still running (a festival, an exhibition,
  // a multi-week light route) is grouped under TODAY rather than its start day: past
  // days are collapsed by default (below), and something you can still go to today
  // must not be folded away with Monday's finished concerts.
  // (startDay / endDay / groupDay are defined up with the date helpers.)
  const byDay = {};
  EVENTS.forEach(e => { const d = groupDay(e); (byDay[d] = byDay[d] || []).push(e); });
  const days = Object.keys(byDay).sort();
  // Within a day: that day's own events by start time (untimed ones after), then runs
  // that started earlier and are still on (exhibitions, festivals). Stable sort, so
  // research order breaks ties.
  const startMins = e => { const t = parseTimes(e.time); return t ? t.start : 24 * 60; };
  days.forEach(d => byDay[d].sort((a, b) =>
    ((startDay(a) < d) - (startDay(b) < d)) || (startMins(a) - startMins(b))));
  // Past days are only folded away when there's something current to show instead —
  // if the whole digest is in the past (e.g. a missed weekly refresh), show it all.
  const hasUpcoming = days.some(d => d >= todayStr);
  const isPastDay = d => hasUpcoming && d < todayStr;

  const mainEl = $('main');
  const dayBlocks = [];
  let pastGroupEl = null, pastDaysEl = null;
  const pastDays = days.filter(isPastDay);
  if (pastDays.length) {
    pastGroupEl = document.createElement('div');
    pastGroupEl.className = 'past-group collapsed';
    const pastTotal = pastDays.reduce((n, d) => n + byDay[d].length, 0);
    const pastRange = pastDays.length === 1
      ? `${weekdayAbbr(pastDays[0])} ${fmtRange(pastDays[0], null)}`
      : `${weekdayAbbr(pastDays[0])} ${fmtRange(pastDays[0], null)} – ${weekdayAbbr(pastDays[pastDays.length-1])} ${fmtRange(pastDays[pastDays.length-1], null)}`;
    pastGroupEl.innerHTML = `
      <button class="day-header" aria-expanded="false" type="button">
        ${CHEVRON_ICON}
        <span class="dow">Past days</span>
        <span class="ddate">${pastRange}</span>
        <span class="day-count">${pastTotal} event${pastTotal===1?'':'s'}</span>
        <span class="rule"></span>
      </button>
      <div class="past-days"></div>`;
    pastDaysEl = pastGroupEl.querySelector('.past-days');
    const pastHdr = pastGroupEl.querySelector('.day-header');
    pastHdr.addEventListener('click', () => {
      const collapsed = pastGroupEl.classList.toggle('collapsed');
      pastHdr.setAttribute('aria-expanded', String(!collapsed));
    });
    mainEl.appendChild(pastGroupEl);
  }
  const collapseAllBtn = document.createElement('button');
  collapseAllBtn.className = 'collapse-all-btn';
  collapseAllBtn.textContent = 'Collapse all days';
  collapseAllBtn.addEventListener('click', () => {
    const anyExpanded = dayBlocks.some(db => !db.el.classList.contains('collapsed'));
    dayBlocks.forEach(db => {
      db.el.classList.toggle('collapsed', anyExpanded);
      const hdr = db.el.querySelector('.day-header');
      if (hdr) hdr.setAttribute('aria-expanded', String(!anyExpanded));
    });
    collapseAllBtn.textContent = anyExpanded ? 'Expand all days' : 'Collapse all days';
  });
  mainEl.before(collapseAllBtn);
  days.forEach(day => {
    const block = document.createElement('div');
    block.className = 'day-block';
    const isToday = day === todayStr;
    const isTomorrow = day === tomorrowStr;
    const past = isPastDay(day);
    block.dataset.day = day;
    dayBlocks.push({day, el: block, past});

    const dayCount = byDay[day].length;
    block.innerHTML = `
      <button class="day-header" aria-expanded="true" type="button">
        ${CHEVRON_ICON}
        <span class="dow${isToday?' today':''}${isTomorrow?' tomorrow':''}">${isToday?'Today · ':''}${isTomorrow?'Tomorrow · ':''}${weekday(day)}</span>
        <span class="ddate">${fmtRange(day,null)}</span>
        <span class="day-count">${dayCount} event${dayCount===1?'':'s'}</span>
        <span class="rule"></span>
      </button>
      <div class="events"></div>`;
    const headerBtn = block.querySelector('.day-header');
    headerBtn.addEventListener('click', () => {
      const collapsed = block.classList.toggle('collapsed');
      headerBtn.setAttribute('aria-expanded', String(!collapsed));
    });
    const evEl = block.querySelector('.events');
    byDay[day].forEach(e => {
      const row = document.createElement('a');
      row.className = 'event';
      row.href = e.url; row.target = '_blank'; row.rel = 'noopener';
      row.dataset.city = e.city;
      row.dataset.tags = e.tags.join('|');
      row.dataset.search = (e.title + ' ' + e.venue).toLowerCase();
      row.dataset.favkey = favKey(e);
      row.dataset.headsup = e.heads_up ? '1' : '0';
      row.dataset.day = day;
      row.dataset.dayEnd = endDay(e) >= day ? endDay(e) : day;
      row.dataset.free = e.price === 'free' ? '1' : '0';
      const key = favKey(e);
      const hasPhoto = !!e.photo;
      if (favorites.has(key)) row.classList.add('is-fav');
      const primaryColor = TYPE_COLOR_VAR[e.tags[0]];
      // Multi-day events get a small pill overlaid on the image corner instead of
      // cramming a second line next to the title. Skip it for effectively-indefinite
      // runs (a different year than the window, e.g. a museum collection open through
      // 2030) — a bare day/month end date with no year reads as wrong, not helpful.
      const sameYear = e.dateEnd && e.dateEnd.slice(0,4) === META.windowStart.slice(0,4);
      const rangeBadge = (e.dateEnd && e.dateEnd !== e.dateStart && sameYear)
        ? `<span class="badge-range">t/m ${fmtRange(e.dateEnd,null)}</span>` : '';
      const catBadge = `<span class="badge-cat" style="--c:${primaryColor}">${e.tags[0]}</span>`;
      const mediaHTML = hasPhoto
        ? `<div class="media"><img src="${e.photo}" alt="" loading="lazy">${rangeBadge}${catBadge}</div>`
        : `<div class="media media-fallback" style="--c:${primaryColor}">${FALLBACK_ICON}${rangeBadge}${catBadge}</div>`;
      const headsUpHTML = e.heads_up
        ? `<div class="heads-up" style="--c:${HEADS_UP_STYLE[e.heads_up].colorVar}"><span class="hu-icon">${HEADS_UP_STYLE[e.heads_up].icon}</span><span><strong>${HEADS_UP_STYLE[e.heads_up].label}</strong>${e.heads_up_reason ? ' — ' + e.heads_up_reason : ''}</span></div>`
        : '';
      // Full time range read out as-is (already human-formatted by research, e.g.
      // "20:30-23:00" or "varies (see listing)"); a plain hyphen between two HH:MM
      // values reads better as an en dash. Cards with no confirmed time still show a
      // pill (muted, not the usual value color) rather than leaving a gap — every
      // card keeps the same meta-row shape.
      const timeLabel = e.time ? e.time.replace(/(\d{2}:\d{2})-(\d{2}:\d{2})/, '$1–$2') : null;
      const timePill = timeLabel
        ? `<span class="meta-pill">${CLOCK_ICON}${timeLabel}</span>`
        : `<span class="meta-pill time-unknown">${CLOCK_ICON}Time on listing</span>`;
      const pricePill = e.price === 'free'
        ? `<span class="meta-pill price-free">${TICKET_ICON}Free</span>`
        : e.price
          ? `<span class="meta-pill">${TICKET_ICON}${e.price}</span>`
          : `<span class="meta-pill price-unknown">${TICKET_ICON}Price on listing</span>`;
      row.innerHTML = `
        ${mediaHTML}
        ${headsUpHTML}
        <div class="body">
          <div class="title-row"><h3 style="--c:${primaryColor}">${e.title}</h3></div>
          <div class="venueline"><span class="code">${e.areaCode}</span><span>${e.venue} · ${e.city}</span></div>
          <div class="meta-row">${timePill}${pricePill}</div>
          <div class="desc">${e.description}</div>
          <div class="tags">${e.tags.map(t => `<span class="tag" style="--c:${TYPE_COLOR_VAR[t]}">${t}</span>`).join('')}</div>
          <div class="actions">
            <div class="left">
              <button class="icon-btn fav" aria-pressed="${favorites.has(key)}" aria-label="Favorite" title="Favorite">${favorites.has(key) ? '★' : '☆'}</button>
              <button class="icon-btn cal" aria-label="Add to calendar" title="Add to calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="1"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg></button>
            </div>
            <span class="go" aria-hidden="true"><span class="go-label">Details</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
          </div>
        </div>`;
      if (hasPhoto) {
        // A broken/expired photo URL degrades to the same fallback tile, swapped in via a
        // real event listener rather than an inline onerror= string (which can't safely
        // hold the fallback SVG's own double-quoted attributes).
        row.querySelector('.media img').addEventListener('error', function () {
          this.closest('.media').outerHTML = `<div class="media media-fallback" style="--c:${primaryColor}">${FALLBACK_ICON}${rangeBadge}${catBadge}</div>`;
        }, { once: true });
      }
      const favToggleBtn = row.querySelector('.fav');
      favButtons[key] = favToggleBtn;
      favToggleBtn.addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        onToggleFav(key);
      });
      row.querySelector('.cal').addEventListener('click', ev => {
        ev.preventDefault(); ev.stopPropagation();
        downloadICS(e, day);
      });
      evEl.appendChild(row);
    });
    (past ? pastDaysEl : mainEl).appendChild(block);
  });
  const upcomingBlocks = () => dayBlocks.filter(db => !db.past);

  function render(){
    updateFilterCount();
    let visibleTotal = 0;
    document.querySelectorAll('.day-block').forEach(block => {
      let visibleInGroup = 0;
      block.querySelectorAll('.event').forEach(ev => {
        const cityOk = state.cities.size === 0 || state.cities.has(ev.dataset.city);
        const evTags = ev.dataset.tags.split('|');
        const typeOk = state.types.size === 0 || evTags.some(t => state.types.has(t));
        const qOk = !state.q || ev.dataset.search.includes(state.q);
        const favOk = !state.favOnly || favorites.has(ev.dataset.favkey);
        const planOk = !state.planOnly || ev.dataset.headsup === '1';
        const whenOk = whenMatches(ev.dataset.day, ev.dataset.dayEnd);
        const freeOk = !state.free || ev.dataset.free === '1';
        const show = cityOk && typeOk && qOk && favOk && planOk && whenOk && freeOk;
        ev.classList.toggle('hidden', !show);
        if(show){ visibleInGroup++; visibleTotal++; }
      });
      block.classList.toggle('hidden', visibleInGroup === 0);
      const dc = block.querySelector('.day-count');
      if (dc) dc.textContent = `${visibleInGroup} event${visibleInGroup===1?'':'s'}`;
    });
    if (pastGroupEl) {
      const pastVisible = pastDaysEl.querySelectorAll('.event:not(.hidden)').length;
      pastGroupEl.classList.toggle('hidden', pastVisible === 0);
      pastGroupEl.querySelector(':scope > .day-header .day-count').textContent = `${pastVisible} event${pastVisible===1?'':'s'}`;
    }
    const favEmpty = state.favOnly && visibleTotal === 0 && !state.planOnly && !state.q && state.types.size === 0 && state.cities.size === 0 && state.when === 'all' && !state.free;
    $('emptyState').classList.toggle('show', visibleTotal === 0);
    $('emptyDefaultMsg').hidden = favEmpty;
    $('emptyFavMsg').hidden = !favEmpty;
    $('resetBtn').hidden = favEmpty;
    const rc = $('resultCount');
    const anyFilter = state.types.size || state.cities.size || state.q || state.favOnly || state.planOnly || state.when !== 'all' || state.free;
    rc.innerHTML = anyFilter ? `Showing ${visibleTotal} of ${EVENTS.length}<button id="clearInline">clear</button>` : `Showing all ${EVENTS.length} events`;
    const ci = $('clearInline');
    if(ci) ci.addEventListener('click', () => {
      state.favOnly = false; state.planOnly = false;
      favBtn.setAttribute('aria-pressed','false'); planBtn.setAttribute('aria-pressed','false');
      $('resetBtn').click();
    });
    sbShowResultsBtn.textContent = visibleTotal === 0 ? 'Show results' : `Show ${visibleTotal} event${visibleTotal===1?'':'s'}`;
  }
  render();
  renderHero();
});
</script>
</body>
</html>
