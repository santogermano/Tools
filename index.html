<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yas' random stuff</title>
<meta name="description" content="A small workshop of web tools.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;transition:background .2s,color .2s}
  a{text-decoration:none}
  ::selection{background:rgba(216,217,74,.35)}
  @keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes shineSweep{0%{background-position:220% 0}100%{background-position:-220% 0}}
  .wrap{max-width:900px;margin:0 auto;padding:0 32px 56px}
  nav{display:flex;justify-content:flex-end;align-items:center;padding:28px 0 0}
  #theme-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:none;cursor:pointer}
  header{padding:32px 0 0;text-align:center}
  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(2rem,5vw,2.7rem);line-height:1;letter-spacing:-.01em;margin:0}
  #tools{width:100%;max-width:600px;aspect-ratio:1;margin:24px auto 8px;position:relative}
  #avatar-outer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:clamp(110px,24vw,180px);height:clamp(110px,24vw,180px)}
  #avatar-float{width:100%;height:100%;animation:avatarFloat 5s ease-in-out infinite}
  #avatar-follow{width:100%;height:100%;transition:transform .15s ease-out;position:relative}
  #avatar-follow img{width:100%;height:100%;object-fit:cover;display:block}
  #shine{position:absolute;top:44%;left:20%;width:60%;height:14%;border-radius:50%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);background-size:250% 100%;mix-blend-mode:screen;pointer-events:none;opacity:0;animation:shineSweep 1.1s linear infinite}
  .tool{position:absolute;transform:translate(-50%,-50%);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(.85rem,2vw,1.05rem);white-space:nowrap;text-align:center;transition:color .2s,transform .2s,text-shadow .2s}
  .tool-desc{display:block;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:.72rem;white-space:normal;width:150px;opacity:0;transition:opacity .2s;pointer-events:none}
</style>
</head>
<body>
  <div class="wrap">
    <nav>
      <button id="theme-btn" aria-label="Toggle theme">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24"></svg>
      </button>
    </nav>

    <header>
      <h1>Yas' random stuff</h1>
    </header>

    <section id="tools">
      <div id="avatar-outer">
        <div id="avatar-float">
          <div id="avatar-follow">
            <img src="avatar.png" alt="Avatar">
            <div id="shine"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const TOOLS = [
      { name: 'Newsletter Generator', desc: 'Turns RSS feeds into a newsletter I\u2019d actually send out.', url: 'tools/newsletter-generator.html' },
      { name: 'Foody — Food Week', desc: 'Weekly meal planning, minus the nightly debate.', url: 'tools/foody-food-week.html' },
      { name: 'Events', desc: 'Where I track things worth going to.', url: 'https://events.yasine.org' }
    ];

    const PAL = {
      dark: { bg: '#14161b', ink: '#f2f3f5', muted: '#9298a3', border: 'rgba(242,243,245,.14)', accent: '#d8d94a' },
      light: { bg: '#f7f5f0', ink: '#201d19', muted: '#726c62', border: 'rgba(32,29,25,.14)', accent: '#7a7d17' }
    };

    let theme = 'dark';
    let hovered = null;

    const toolsEl = document.getElementById('tools');
    const nodes = TOOLS.map((t, i) => {
      const angle = (-90 + i * (360 / TOOLS.length)) * Math.PI / 180;
      const left = 50 + 36 * Math.cos(angle);
      const top = 50 + 36 * Math.sin(angle);
      const a = document.createElement('a');
      a.className = 'tool';
      a.href = t.url;
      if (/^https?:\/\//.test(t.url)) { a.target = '_blank'; a.rel = 'noopener'; }
      a.style.top = top + '%';
      a.style.left = left + '%';
      a.innerHTML = t.name + '<span class="tool-desc">' + t.desc + '</span>';
      a.addEventListener('mouseenter', () => { hovered = i; render(); });
      a.addEventListener('mouseleave', () => { hovered = null; render(); });
      toolsEl.appendChild(a);
      return a;
    });

    const avatarFollow = document.getElementById('avatar-follow');
    toolsEl.addEventListener('mousemove', (e) => {
      const r = toolsEl.getBoundingClientRect();
      const dx = Math.max(-14, Math.min(14, (e.clientX - (r.left + r.width / 2)) * 0.06));
      const dy = Math.max(-14, Math.min(14, (e.clientY - (r.top + r.height / 2)) * 0.06));
      avatarFollow.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });

    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    themeBtn.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; render(); });

    function renderIcon() {
      const pal = PAL[theme];
      themeBtn.style.border = '1px solid ' + pal.border;
      themeBtn.style.color = pal.ink;
      if (theme === 'dark') {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="8" fill="currentColor"></circle><circle cx="16" cy="9" r="6.5" fill="' + pal.bg + '"></circle>';
      } else {
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>' +
          '<line x1="12" y1="2" x2="12" y2="5" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="5" y1="5" x2="7" y2="7" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="17" y1="17" x2="19" y2="19" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="17" y1="7" x2="19" y2="5" stroke="currentColor" stroke-width="1.8"></line>' +
          '<line x1="5" y1="19" x2="7" y2="17" stroke="currentColor" stroke-width="1.8"></line>';
      }
    }

    function render() {
      const pal = PAL[theme];
      document.body.style.background = pal.bg;
      document.body.style.color = pal.ink;
      renderIcon();
      document.getElementById('shine').style.opacity = hovered !== null ? 1 : 0;
      nodes.forEach((a, i) => {
        const isHovered = hovered === i;
        a.style.color = isHovered ? pal.ink : pal.muted;
        a.style.transform = 'translate(-50%,-50%) scale(' + (isHovered ? 1.16 : 1) + ')';
        a.style.textShadow = isHovered ? '0 0 20px ' + pal.accent : 'none';
        a.querySelector('.tool-desc').style.opacity = isHovered ? 1 : 0;
        a.querySelector('.tool-desc').style.color = pal.muted;
      });
    }

    render();
  </script>
</body>
</html>
