<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasine — Tools</title>
<meta name="description" content="A small workshop of standalone web tools.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181614;
    --muted:#71685f;
    --paper:#faf8f4;
    --line:rgba(24,22,20,.12);
    --accent:#a6491f;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  a{color:inherit}

  .wrap{max-width:860px;margin:0 auto;padding:0 1.5rem}

  header{padding:5rem 0 3.5rem;border-bottom:1px solid var(--line)}
  .kicker{
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:1.1rem;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2.1rem,5vw,3rem);
    letter-spacing:-.01em;margin-bottom:.9rem;
  }
  header p{color:var(--muted);font-size:1.02rem;max-width:34rem}

  nav.top{
    display:flex;justify-content:flex-end;gap:1.75rem;padding:1.5rem 0 0;
  }
  nav.top a{
    font-size:.85rem;color:var(--muted);text-decoration:none;
    border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
  }
  nav.top a:hover{color:var(--ink);border-color:var(--ink)}

  main{padding:3.5rem 0 2rem}

  section + section{margin-top:3.5rem}
  .section-label{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:500;margin-bottom:1.4rem;
  }

  ul.tools{list-style:none}
  .tool{
    display:flex;align-items:baseline;gap:1.25rem;
    padding:1.4rem 0;border-top:1px solid var(--line);
    text-decoration:none;
  }
  ul.tools li:last-child .tool{border-bottom:1px solid var(--line)}
  .tool-index{
    font-family:'Fraunces',serif;font-size:.85rem;color:var(--muted);
    flex:0 0 1.8rem;padding-top:.15rem;
  }
  .tool-body{flex:1;min-width:0}
  .tool-name{
    font-size:1.12rem;font-weight:500;display:flex;align-items:baseline;gap:.5rem;
  }
  .tool-name .arrow{
    opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s;
    color:var(--accent);
  }
  .tool:hover .tool-name .arrow{opacity:1;transform:translateX(0)}
  .tool:hover .tool-name{color:var(--accent)}
  .tool-desc{display:block;color:var(--muted);font-size:.92rem;margin-top:.3rem}

  .feature{
    display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;
    padding:1.6rem 1.6rem;border:1px solid var(--line);border-radius:2px;
    text-decoration:none;background:rgba(166,73,31,.035);
    transition:border-color .15s,background .15s;
  }
  .feature:hover{border-color:var(--accent);background:rgba(166,73,31,.06)}
  .feature-name{display:block;font-size:1.12rem;font-weight:500}
  .feature-desc{display:block;color:var(--muted);font-size:.92rem;margin-top:.3rem}
  .feature-tag{
    font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    white-space:nowrap;flex:0 0 auto;padding-top:.2rem;
  }

  footer{
    border-top:1px solid var(--line);padding:2.2rem 0 3rem;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:.75rem;
    color:var(--muted);font-size:.82rem;
  }

  @media (max-width:600px){
    header{padding:3.5rem 0 2.5rem}
    nav.top{justify-content:flex-start;gap:1.25rem;flex-wrap:wrap}
    .tool{gap:.9rem}
  }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="top">
      <a href="#tools">Tools</a>
      <a href="https://events.yasine.org">Events ↗</a>
    </nav>
    <header>
      <p class="kicker">Yasine.org</p>
      <h1>A small workshop of web tools.</h1>
      <p>Independent, single-page tools — no accounts, no tracking, nothing installed. Open one and start using it.</p>
    </header>

    <main>
      <section id="tools">
        <p class="section-label">Tools</p>
        <ul class="tools" id="tools-list"></ul>
      </section>

      <section>
        <p class="section-label">Elsewhere</p>
        <a class="feature" href="https://events.yasine.org" target="_blank" rel="noopener">
          <span>
            <span class="feature-name">Events</span>
            <span class="feature-desc">A companion site for browsing and planning events.</span>
          </span>
          <span class="feature-tag">events.yasine.org ↗</span>
        </a>
      </section>
    </main>

    <footer>
      <span>Yasine.org</span>
      <span id="year"></span>
    </footer>
  </div>

  <script>
    // Add a tool by adding one entry here — no build step, no fetch.
    const TOOLS = [
      {
        name: 'Newsletter Generator',
        desc: 'Turn RSS feeds into a formatted, ready-to-send email newsletter.',
        url: 'tools/newsletter-generator.html'
      },
      {
        name: 'Travel Advisor',
        desc: 'A curated trip planner with filterable stays, activities and routes.',
        url: 'tools/travel-advisor.html'
      },
      {
        name: 'Foody — Food Week',
        desc: 'A weekly meal planner with a built-in nutrition and variety balance.',
        url: 'tools/foody-food-week.html'
      },
      {
        name: 'European ETF Investment Guide',
        desc: 'A reference guide to building a low-cost, diversified ETF portfolio in Europe.',
        url: 'tools/etf-investment-guide.html'
      }
    ];

    const list = document.getElementById('tools-list');
    list.innerHTML = TOOLS.map((t, i) => `
      <li>
        <a class="tool" href="${t.url}">
          <span class="tool-index">${String(i + 1).padStart(2, '0')}</span>
          <span class="tool-body">
            <span class="tool-name">${t.name}<span class="arrow">→</span></span>
            <span class="tool-desc">${t.desc}</span>
          </span>
        </a>
      </li>
    `).join('');

    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
